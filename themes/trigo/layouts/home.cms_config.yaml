{{- /* CMS config:

- Get CMS params from config/params.yaml.
- Merge some site config defaults.
- Output CMS config setup to be used by CMS Admin page.
*/ -}}


{{- if site.Params.enable_cms -}}

{{- $repo := site.Params.git_repository -}}
{{- $url := urls.Parse $repo -}}

{{- $locales := slice -}}
{{- range hugo.Sites -}}
  {{- $locales = $locales | append .Language.Name -}}
{{- end -}}

{{- $pages := where site.RegularPages "Date.Year" "gt" 1  -}}
{{- $pages = where $pages "Section" "eq" (index site.MainSections 0) -}}
{{- $years := slice -}}
{{- with $pages -}}
  {{- $sorted := sort . "Date" "asc" -}}
  {{- $oldest := (index $sorted 0).Date.Year -}}
  {{- $latest := (index $sorted (sub (len $sorted) 1)).Date.Year -}}
  {{- $years = seq $oldest $latest }}
{{- end -}}

site_url: {{ site.BaseURL }}

app_title: {{ site.Params.cms_app_title | default "Admin CMS" }}
logout_redirect_url: {{ site.Params.cms_logout_redirect_url }}
logo:
  src: {{ site.Params.cms_logo_src }}

backend:
  name: {{ index (split ($url.Hostname) ".") 0 }}
  repo: {{ strings.TrimSuffix ".git" (trim $url.Path "/") }}
  branch: {{ site.Params.cms_branch | default "main" }}
  auth_methods: [token]
  open_authoring: true
  auth_scope: public_repo
  cms_label_prefix: cms/
  squash_merges: true
  preview_context: pages preview
  commit_messages:
    create: '{{ "Create {{collection}} {{slug}} by @{{author-login}}" }}'
    update: '{{ "Update {{collection}} {{slug}} by @{{author-login}}" }}'
    delete: '{{ "Delete {{collection}} {{slug}} by @{{author-login}}" }}'
    uploadMedia: '{{ "Upload {{path}} by @{{author-login}}" }}'
    deleteMedia: '{{ "Delete {{path}} by @{{author-login}}" }}'
    openAuthoring: '{{ "{{message}} by @{{author-login}} by @{{author-login}}" }}'

publish_mode: editorial_workflow

media_folder: /static
public_folder: /
asset_collections:
  - name: sponsors
    label: Sponsors
    icon: person_add
    media_folder: /assets/sponsors
    public_folder: /sponsors
  - name: icons
    label: Icons
    icon: add_reaction
    media_folder: /themes/trigo/assets/svg
    public_folder: /svg
media_libraries:
  default:
    config:
      max_file_size: 1024000 # in bytes
      slugify_filename: true
      transformations:
        raster_image: # original format
          format: webp # new format, only `webp` is supported with sveltia for now
          quality: 80
          width: 1600
          height: 1600
        svg:
          optimize: true

i18n:
  structure: multiple_folders
  locales: [{{ delimit $locales ", " }}]
  default_locale: en
  initial_locales: default

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
  trim: true
  lowercase: true

output:
  omit_empty_optional_fields: true

field_defaults:
  richtext:
    linked_images: false

collections:

  - name: homepage
    label: Homepage
    media_folder: ''
    public_folder: ''
    thumbnail: cover.image
    icon: home
    i18n: true
    files:
      - name: homepage
        label: Homepage
        file: '{{ "content/{{locale}}/_index.md" }}'
        icon: home
        i18n: true
        fields:
          - name: title
            label: Title
            widget: string
            i18n: true
          - name: description
            label: Description
            widget: string
            i18n: true
          - name: linkTitle
            label: Link Title
            widget: string
            i18n: true
            required: false
          - name: cover
            label: Cover
            widget: object
            i18n: true
            required: false
            fields:
              - { name: image, label: Image, widget: image, i18n: duplicate, required: false }
              - { name: caption, label: Caption, widget: string, i18n: true, required: false }
          - name: body
            label: Body
            widget: richtext
            i18n: true
            required: false

{{- $sections := where hugo.Sites.Default.Sections "Section" "!=" "admin" -}}
{{- range $sections.ByWeight -}}
  {{- $section := .Section -}}
  {{- $label := humanize $section }}

  - divider: true

  {{- if not .Pages }}
  - name: {{ $section }}-section
    label: {{ $label }}
    description: {{ $label }} section
    media_folder: ''
    public_folder: ''
    thumbnail: {{ printf "['/{{slug}}.webp', cover.image]" }}
    icon: {{ .Page.Params.icon_cms }}
    i18n: true
    files:
      - name: {{ $section }}-section
        label: {{ $label }}
        file: '{{ printf "content/{{locale}}/%s/_index.md" $section }}'
        icon: {{ .Page.Params.icon_cms }}
        i18n: true
        fields:
          - name: title
            label: Title
            widget: string
            i18n: true
          - name: description
            label: Description
            widget: string
            i18n: true
          - name: linkTitle
            label: Link Title
            widget: string
            i18n: true
            required: false
          - name: cover
            label: Cover
            widget: object
            i18n: true
            required: false
            fields:
              - { name: image, label: Image, widget: image, i18n: duplicate, required: false }
              - { name: caption, label: Caption, widget: string, i18n: true, required: false }
          - name: body
            label: Body
            widget: richtext
            i18n: true
            required: false

  {{- else }}
  - name: {{ $section }}-pages
    label: {{ $label }}
    description: {{ $label }} collection
    folder: '{{ printf "content/{{locale}}/%s" $section }}'
    path: '
    {{- if eq $section (index site.MainSections 0) -}}
      {{- printf "{{year}}/{{month}}/{{slug}}/index" -}}
    {{- else if .RegularPages -}}
      {{- printf "{{slug}}/index" -}}
    {{- else if .Sections -}}
      {{- printf "{{slug}}/_index" -}}
    {{- else -}}
      {{- printf "_index" -}}
    {{- end -}}'
    {{- if and .Sections .RegularPagesRecursive }}
    nested:
      depth: 5
      summary: '{{ printf "{{title}}" }}'
      subfolders: true
    meta: {{ printf "{ path: { index_file: _index } }" }}
    {{- end }}
    media_folder: ''
    public_folder: ''
    thumbnail: {{ printf "['/{{slug}}.webp', cover.image]" }}
    icon: {{ .Page.Params.icon_cms }}
    summary: "{{ "**{{title}}** {{date | date('DD MMM YYYY')}} {{draft | ternary('(draft)', '')}} · {{author | default('no author')}} · {{locales | upper}}" }}"
    reorder:
      key: weight
    i18n: true

    {{- if eq $section (index site.MainSections 0) }}
    sortable_fields:
      fields: [title, date, author, category]
      default:
        field: date
        direction: descending

    view_groups:
      groups:
        - name: year
          label: Year
          field: date
          pattern: '\d{4}'
        - name: category
          label: Category
          field: category
      default: year
    {{- end }}

    view_filters:
      filters:
        - name: drafts
          label: Drafts
          field: draft
          pattern: true
        - name: upcoming
          label: Upcoming date
          field: date
          gte: '{{ printf "{{today}}" }}'
        {{- if eq $section (index site.MainSections 0) -}}
        {{- range $years }}
        - name: posts_{{ . }}
          label: Posted in {{ . }}
          field: date
          pattern: '^{{ . }}'
        {{- end -}}
        {{- end }}
    index_file:
      name: _index
      label: {{ $label }} Index
      icon: home
      i18n: true
      fields:
        - name: title
          label: Title
          widget: string
          i18n: true
        - name: description
          label: Description
          widget: string
          i18n: true
        - name: linkTitle
          label: Link Title
          widget: string
          i18n: true
          required: false
        - name: redirect
          label: Redirect
          widget: string
          i18n: duplicate
          required: false
        - name: cover
          label: Cover
          widget: object
          i18n: true
          required: false
          fields:
            - { name: image, label: Image, widget: image, i18n: duplicate, required: false }
            - { name: caption, label: Caption, widget: string, i18n: true, required: false }
        - name: body
          label: Body
          widget: richtext
          i18n: true
          required: false

    fields:
      - name: title
        label: Title
        widget: string
        i18n: true
      - name: description
        label: Description
        widget: string
        i18n: true
        required: false

      {{- if .Sections }}
      - name: linkTitle
        label: Link Title
        widget: string
        i18n: true
        required: false
      - name: redirect
        label: Redirect
        widget: string
        i18n: duplicate
        required: false
      {{- end }}
      - name: date
        label: Date
        widget: datetime
        type: date
        i18n: duplicate
      - name: draft
        label: Draft
        widget: boolean
        default: false
        i18n: duplicate
        required: false
      {{ if eq $section (index site.MainSections 0) -}}
      - name: author
        label: Author
        widget: string
        i18n: duplicate
        required: false
      - name: category
        label: Category
        widget: select
        options:
          - { label: Announcement, value: announcement }
          - { label: Event, value: event }
          - { label: Feature, value: feature }
          - { label: Showcase, value: showcase }
          - { label: Tutorial, value: tutorial }
          - { label: Update, value: update }
        i18n: duplicate
      - name: tags
        label: Tags
        widget: list
        i18n: duplicate
        required: false
      {{- end }}
      - name: cover
        label: Cover
        widget: object
        i18n: true
        required: false
        fields:
          - { name: image, label: Image, widget: image, i18n: duplicate, required: false }
          - { name: caption, label: Caption, widget: string, i18n: true, required: false }
      - name: body
        label: Body
        widget: richtext
        i18n: true
  {{- end -}}
{{- end }}

  - divider: true

  - name: theme
    label: Theme i18n
    icon: language
    i18n: true
    files:
      - name: translations
        label: Theme Translations
        file: '{{ "themes/trigo/i18n/{{locale}}.yaml" }}'
        icon: language
        i18n: true
        fields:
          - name: strings
            label: i18n strings
            widget: list
            root: true
            summary: '{{ "{{id}} - {{translation}}" }}'
            i18n: true
            allow_add: false
            allow_remove: false
            allow_duplicate: false
            allow_reorder: false
            hint: '{{ "Template variables such as {{ .Count }} are supported." }}'
            fields:
              - name: id
                label: Translation ID
                widget: string
                i18n: duplicate
              - name: translation
                label: Translation
                widget: string
                i18n: true

singletons:

  - name: settings
    label: Site Settings
    file: config/_default/params.yaml
    icon: settings
    fields:
      - name: site_author
        label: Default site author
        widget: string
      - name: site_keywords
        label: Site keywords and tags
        widget: list
      - name: site_logo
        label: Site logo
        widget: image
        media_folder: /static
        public_folder: /
      - name: default_icon
        label: Default placeholder icon
        widget: image
        media_folder: /static
        public_folder: /
      - name: git_repository
        label: Git repository URL
        widget: string
      - name: socials
        label: Social media links
        widget: list
        summary: '{{ "{{label}}" }}'
        collapsed: auto
        fields:
          - name: label
            label: Label
            widget: string
          - name: url
            label: Social media URL
            widget: string
      - name: style
        label: Theme Style
        hint: Only change the value. Please leave the key (variable name) as-is.
        widget: keyvalue
        key_label: CSS variable name
        value_label: CSS value

  - divider: true

  - name: sponsors
    label: Sponsors list
    file: data/sponsors.yaml
    icon: person_add
    fields:
      - name: sponsors
        label: Sponsors
        label_singular: Sponsor
        widget: list
        summary: '{{ "{{label}} - {{tier}}" }}'
        thumbnail: logo
        collapsed: auto
        root: true
        fields:
          - name: id
            label: Sponsor ID
            widget: hidden
            default: '{{ "{{index}}" }}'
          - name: label
            label: Label
            widget: string
          - name: description
            label: Description
            widget: string
            required: false
          - name: logo
            label: Logo
            widget: image
            media_folder: /assets/sponsors
            public_folder: /sponsors
            required: false
          - name: link
            label: Link
            widget: string
            required: false
          - name: tier
            label: Sponsoring tier
            widget: select
            options:
              - { label: Corporate, value: corporate }
              - { label: Gold, value: gold }
              - { label: Early, value: early }
              - { label: Silver, value: silver }
              - { label: Bronze, value: bronze }
          - name: start_date
            label: Start date
            widget: datetime
            type: date

{{- end -}}