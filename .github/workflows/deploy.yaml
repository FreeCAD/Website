
# Deploy workflow
#
# Website deployment to the FreeCAD staging or production containers.
#
# Production automatically deploys on every push to main and hourly, so that
# blog posts dated in the future appear within the hour (the site is built
# without them until their date).
#
# Either environment can also be deployed by workflow_dispatch. The chosen
# environment supplies the host, account, and key, and its protection rules
# control the run.


name: Deploy
run-name: Deploy to ${{ inputs.environment || 'production' }} by @${{ github.triggering_actor }}

on:
  push:
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "CODE_OF_CONDUCT.md"
      - "CONTRIBUTING.md"
      - ".editorconfig"
      - ".gitignore"
      - ".vscode/settings.json"
      - ".github/**"
      - "notes/**"
      - "tools/**"
    branches:
      - main

  schedule:
    - cron: "05 * * * *" # Hourly at *:05 UTC (avoiding other stuff at the top of the hour)

  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy to
        type: choice
        options:
          - staging
          - production
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'production' }}
    timeout-minutes: 10

    steps:
      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server-side deploy is pinned as a forced command in the deploy
      # account's authorized_keys, so no command is sent here.
      - name: Deploy
        env:
          DEPLOY_TARGET: ${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}
        run: |
          ssh \
            -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o ConnectTimeout=15 \
            -n \
            "$DEPLOY_TARGET"
