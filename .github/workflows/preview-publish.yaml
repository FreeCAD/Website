name: Preview publish

on:
  workflow_run:
    workflows: ["Preview build"]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: preview-publish-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest

    steps:
      - name: Validate current pull request
        id: pull-request
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            if (!Number.isSafeInteger(number) || number < 1) {
              core.setFailed('The workflow run did not provide a valid pull request number.');
              return;
            }

            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: number
            });

            if (pull.state !== 'open' || pull.draft) {
              core.setFailed('The pull request is no longer open and ready for review.');
              return;
            }

            core.setOutput('number', String(number));
            core.setOutput('head-sha', pull.head.sha);
            core.setOutput('artifact', `preview-${number}-${pull.head.sha}`);

      - name: Download preview artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ steps.pull-request.outputs.artifact }}
          path: ${{ runner.temp }}/preview-site
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate static preview
        env:
          PREVIEW_DIR: ${{ runner.temp }}/preview-site
        run: |
          if [ ! -f "$PREVIEW_DIR/index.html" ]; then
            echo "The preview artifact has no index.html." >&2
            exit 1
          fi

          if find "$PREVIEW_DIR" -type l -print -quit | grep -q .; then
            echo "The preview artifact must not contain symbolic links." >&2
            exit 1
          fi

          if find "$PREVIEW_DIR" ! -type d ! -type f -print -quit | grep -q .; then
            echo "The preview artifact contains an unsupported file type." >&2
            exit 1
          fi

          if find "$PREVIEW_DIR" -name .git -print -quit | grep -q .; then
            echo "The preview artifact must not contain Git metadata." >&2
            exit 1
          fi

      - name: Set preview URL
        id: preview-url
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          CONFIGURED_BASE_URL: ${{ vars.PREVIEW_BASE_URL }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        with:
          script: |
            const repositoryName = process.env.REPOSITORY.split('/')[1];
            const defaultBase = `https://${process.env.REPOSITORY_OWNER}.github.io/${repositoryName}/`;
            const base = process.env.CONFIGURED_BASE_URL || defaultBase;
            const url = `${base.replace(/\/$/, '')}/pr-${process.env.PR_NUMBER}/`;
            core.setOutput('url', url);

      - name: Publish preview
        uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: pages
          publish_dir: ${{ runner.temp }}/preview-site
          destination_dir: pr-${{ steps.pull-request.outputs.number }}
          keep_files: true
          commit_message: "Preview PR #${{ steps.pull-request.outputs.number }} at ${{ steps.pull-request.outputs.head-sha }}"

      - name: Post or update preview comment
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PREVIEW_URL: ${{ steps.preview-url.outputs.url }}
          PR_NUMBER: ${{ steps.pull-request.outputs.number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const marker = `<!-- freecad-website-preview:${number} -->`;
            const body = `${marker}\n**Preview:** ${process.env.PREVIEW_URL}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body
              });
            }
