name: Preview cleanup

on:
  pull_request_target:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-publish-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pages branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: pages
          fetch-depth: 0

      - name: Remove preview directory
        id: remove
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "Invalid pull request number." >&2; exit 1 ;;
          esac

          preview_dir="pr-${PR_NUMBER}"
          if [ -d "$preview_dir" ]; then
            rm -rf -- "$preview_dir"
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit cleanup
        if: steps.remove.outputs.removed == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          preview_dir="pr-${PR_NUMBER}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- "$preview_dir"
          git commit -m "Clean up preview for PR #${PR_NUMBER}"
          git push origin pages

      - name: Update preview comment
        if: steps.remove.outputs.removed == 'true'
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        with:
          script: |
            const number = Number(process.env.PR_NUMBER);
            const marker = `<!-- freecad-website-preview:${number} -->`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: number,
              per_page: 100
            });
            const existing = comments.find(comment =>
              comment.user.login === 'github-actions[bot]' && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: `${marker}\nPreview removed because this pull request was closed.`
              });
            }
