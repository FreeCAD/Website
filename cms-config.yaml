site_url: https://FreeCAD.github.io/Website/

app_title: FreeCAD Admin CMS
logout_redirect_url: https://www.freecad.org
logo:
  src: https://www.freecad.org/svg/icon-freecad.svg

backend:
  name: github
  repo: freecad/website
  branch: main
  auth_methods: [token]
  open_authoring: true
  auth_scope: public_repo
  cms_label_prefix: cms/
  squash_merges: true
  preview_context: pages preview
  prompt_commit_messages: true
  commit_messages:
    create: '{{collection}}: Create {{slug}} by @{{author-login}}'
    update: '{{collection}}: Update {{slug}} by @{{author-login}}'
    delete: '{{collection}}: Delete {{slug}} by @{{author-login}}'
    uploadMedia: 'Media: Upload {{path}} by @{{author-login}}'
    deleteMedia: 'Media: Delete {{path}} by @{{author-login}}'
    openAuthoring: '{{message}} by @{{author-login}}'

publish_mode: editorial_workflow

media_folder: /static
public_folder: /
asset_collections:
  - name: sponsors
    label: Sponsors
    icon: person_add
    media_folder: /assets/sponsors
    public_folder: /sponsors
  - name: icons
    label: Icons
    icon: add_reaction
    media_folder: /themes/trigo/assets/svg
    public_folder: /svg
media_libraries:
  default:
    config:
      max_file_size: 1024000 # in bytes
      slugify_filename: true
      transformations:
        raster_image: # original format
          format: webp # new format, only `webp` is supported with sveltia for now
          quality: 75
          width: 1600
          height: 1600
        svg:
          optimize: true

i18n:
  structure: multiple_folders
  locales: [en, zh, es, fr, pt, de, ja]
  default_locale: en
  initial_locales: default

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: '-'
  trim: true
  lowercase: true

output:
  omit_empty_optional_fields: true

field_defaults:
  richtext:
    linked_images: false

collections:

  - name: homepage
    label: Homepage
    media_folder: ''
    public_folder: ''
    thumbnail: cover.image
    icon: home
    i18n: true
    files:
      - name: homepage
        label: Homepage
        file: 'content/{{locale}}/_index.md'
        icon: home
        summary: "Homepage - **{{title}}** · {{locales | upper}}"
        i18n: true
        fields:
          - name: title
            label: Title
            widget: string
            i18n: true
          - name: description
            label: Description
            widget: string
            i18n: true
          - name: buttons
            label: Buttons
            widget: list
            i18n: true
            required: false
            fields:
              - { name: link, label: Button link, widget: string, i18n: duplicate }
              - { name: label, label: Button label, widget: string, i18n: true, required: false }
          - name: cover
            label: Cover
            widget: object
            i18n: true
            required: false
            fields:
              - { name: image, label: Image, widget: image, i18n: duplicate, required: false }
              - { name: caption, label: Caption, widget: string, i18n: true, required: false }
          - name: body
            label: Body
            widget: richtext
            i18n: true
            required: false

